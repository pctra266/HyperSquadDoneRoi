<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="HyperSquad PopCat – Click vào thần tượng của bạn và xem điểm leo bảng xếp hạng theo thời gian thực!" />
  <meta name="theme-color" content="#0a0a1a" />

  <!-- Open Graph -->
  <meta property="og:title" content="HyperSquad PopCat – Bầu Chọn Thần Tượng" />
  <meta property="og:description" content="Click mèo, thi đấu trực tiếp. Ai sẽ thắng?" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/jpeg" href="/logo/logo.jpg" />
  <title>HyperSquad PopCat</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ── Intro Splash ──────────────────────────────────────────────────── -->
  <div id="splash" class="splash" aria-live="polite">
    <div class="splash-inner">
      <img src="/logo/logo.jpg" alt="HyperSquad PopCat Logo" class="splash-logo-img" />
      <h1 class="splash-title"><span class="logo-hyper">HYPER</span><span class="logo-squad">POPCAT</span>
      </h1>
      <p class="splash-sub">Đang kết nối…</p>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- ── Error Banner (hidden by default) ──────────────────────────────── -->
  <div id="error-banner" class="error-banner" role="alert" style="display:none"></div>

  <!-- ── App Shell ─────────────────────────────────────────────────────── -->
  <div id="app" class="app">

    <!-- ── Header ───────────────────────────────────────────────────────── -->
    <header class="header" role="banner">
      <div class="header-inner">
        <div class="header-logo">
          <img src="/logo/logo.jpg" alt="HyperSquad PopCat Logo" class="header-logo-img" />
          <div class="logo-text">
            <span class="logo-hyper">HYPER</span><span class="logo-squad">POPCAT</span>
          </div>
        </div>

        <div class="header-stats">
          <div class="stat-chip" id="chip-clicks">
            <span class="stat-chip-label">CLICK CỦA TÔI</span>
            <span class="stat-chip-value" id="stat-total-clicks">0</span>
          </div>
          <div class="stat-chip" id="chip-score">
            <span class="stat-chip-label">TỔNG POP</span>
            <span class="stat-chip-value" id="stat-total-score">0</span>
          </div>
          <div id="connection-status" class="connected" aria-live="polite">● TRỰC TIẾP</div>
        </div>
      </div>
    </header>

    <!-- ── Main Layout ───────────────────────────────────────────────────── -->
    <main class="main-layout" role="main">

      <!-- Cats Grid -->
      <section class="cats-section" aria-label="Cat clickers">
        <!-- CatComponent elements are injected here by JavaScript -->
        <div id="cats-grid" class="cats-grid" role="list" aria-label="Danh sách nhân vật"></div>
      </section>

      <!-- Sidebar -->
      <aside class="sidebar" aria-label="Leaderboard">
        <div class="sidebar-card">
          <h3 class="sidebar-title">
            <span>🏆</span> Bảng Xếp Hạng
          </h3>
          <ul id="leaderboard-list" class="leaderboard-list" role="list" aria-live="polite">
            <!-- Populated by GameManager -->
          </ul>
        </div>

        <div class="sidebar-card donate-card">
          <h3 class="sidebar-title"><span>🍞</span> Ủng Hộ Tác Giả</h3>
          <div class="donate-inline">
            <p class="donate-text">
              <span class="donate-emoji-big">🥖</span>
              Ủng hộ chủ trang web<br />
              <strong>cái bánh mì nha! 🥖✨</strong>
            </p>
            <div class="donate-qr-wrap">
              <img src="/cats/qr.jpg" alt="QR Code ủng hộ qua VietQR MB Bank" class="donate-qr" loading="lazy" />
            </div>
            <p class="donate-sub">Scan QR · VietQR · MB Bank</p>
          </div>
        </div>
      </aside>
    </main>

  </div>



  <!-- ES Module entry point -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
